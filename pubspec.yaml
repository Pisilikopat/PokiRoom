name: poki_room
description: A cozy 1-on-1 private room app with cats, streaks, foggy messages, and realtime presence.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  google_fonts: ^6.2.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  record: ^5.2.0
  audioplayers: ^6.1.0
  flutter_webrtc: ^0.12.5
  permission_handler: ^11.3.1
  http: ^1.2.2

dependency_overrides:
  record_linux: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
