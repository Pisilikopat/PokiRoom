name: Build and Deploy PokiRoom

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Generate Platform Scaffolding and Configure Firebase
        run: |
          flutter create --project-name poki_room --platforms=web,android .
          # Copy google-services.json to android/app
          cp google-services.json android/app/google-services.json
          
          # Add google-services plugin to android/settings.gradle
          sed -i '/plugins {/a \    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle
          
          # Add google-services plugin to android/app/build.gradle
          sed -i '/plugins {/a \    id "com.google.gms.google-services"' android/app/build.gradle

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href "/PokiRoom/"

      - name: Upload Web Artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poki-room-apk
          path: build/app/outputs/flutter-apk/*.apk
