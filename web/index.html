<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PokiRoom - 1'e 1 Özel Oda">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PokiRoom">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PokiRoom 🐾</title>
  <link rel="manifest" href="manifest.json">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    body {
      background-color: #FFFDF9;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Quicksand', sans-serif;
    }
    .loading-spinner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #4A403A;
    }
  </style>
</head>
<body>
  <div class="loading-spinner" id="loading">
    <div style="font-size: 36px;">🐾</div>
    <div style="font-weight: 600;">PokiRoom Yükleniyor...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // WebRTC Mobile Audio Autoplay & Output Helper
    (function() {
      function playAllWebRTCAudio() {
        var elements = document.querySelectorAll('audio, video');
        elements.forEach(function(el) {
          try {
            el.setAttribute('playsinline', 'true');
            el.setAttribute('webkit-playsinline', 'true');
            if (el.srcObject && el.paused) {
              var p = el.play();
              if (p && p.catch) p.catch(function() {});
            }
          } catch(e) {}
        });
      }

      var observer = new MutationObserver(function(mutations) {
        for (var i = 0; i < mutations.length; i++) {
          var nodes = mutations[i].addedNodes;
          for (var j = 0; j < nodes.length; j++) {
            var node = nodes[j];
            if (node.nodeName === 'AUDIO' || node.nodeName === 'VIDEO') {
              try {
                node.setAttribute('playsinline', 'true');
                node.setAttribute('webkit-playsinline', 'true');
                var p = node.play();
                if (p && p.catch) p.catch(function() {});
              } catch(e) {}
            }
          }
        }
      });

      if (document.documentElement) {
        observer.observe(document.documentElement, { childList: true, subtree: true });
      }

      ['click', 'touchstart', 'touchend', 'pointerdown'].forEach(function(evt) {
        document.addEventListener(evt, function() {
          playAllWebRTCAudio();
        }, { passive: true });
      });

      setInterval(playAllWebRTCAudio, 1000);

      window.pokiDownloadBytes = function(base64Data, filename) {
        var byteCharacters = atob(base64Data);
        var byteNumbers = new Array(byteCharacters.length);
        for (var i = 0; i < byteCharacters.length; i++) {
          byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        var byteArray = new Uint8Array(byteNumbers);
        var blob = new Blob([byteArray], { type: 'image/png' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = filename || 'PokiTuval.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
      };

    })();
  </script>
</body>
</html>
